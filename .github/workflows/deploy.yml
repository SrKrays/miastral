name: Deploy a Ferozo

# Se dispara solo con un push a main. Nada de subir archivos a mano por FTP
# nunca más — esto compila el proyecto y sincroniza automáticamente el
# resultado con public_html en Ferozo/DonWeb.
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # No tocar nunca la carpeta de imágenes de producto que sube el
          # panel admin por FTP directo (public_html/img/productos) — esa
          # carpeta no forma parte del build y no debe borrarse ni pisarse.
          exclude: |
            **/img/**
            **/img/
